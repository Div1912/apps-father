services:
  postgres:
    image: postgres:16-alpine
    container_name: apps_father_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apps_father
      POSTGRES_USER: apps_father
      POSTGRES_PASSWORD: apps_father_secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

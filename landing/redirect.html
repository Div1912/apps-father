<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title data-i18n="title">Opening Apps Father…</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18093639890"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'AW-18093639890');

    function gtag_report_conversion(url) {
      var callback = function () {
        if (typeof (url) != 'undefined') { window.location = url; }
      };
      gtag('event', 'conversion', {
        'send_to': 'AW-18093639890/NXdICOnui54cENKR3LND',
        'value': 1.0,
        'currency': 'UAH',
        'event_callback': callback
      });
      return false;
    }
  </script>

  <style>
    :root {
      --bg: #0a0f1e;
      --text: #e6ebf3;
      --muted: #8b97a8;
      --accent: #00a8ff;
      --grad: linear-gradient(135deg, #00d4ff, #00a8ff 60%, #4f8cff);
      --border: rgba(99, 179, 237, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(0, 168, 255, 0.10), transparent 60%),
        radial-gradient(800px 600px at 80% 90%, rgba(79, 140, 255, 0.10), transparent 60%),
        var(--bg);
    }

    .card {
      max-width: 420px;
      width: 100%;
      padding: 32px 28px;
      border-radius: 20px;
      background: rgba(15, 22, 40, 0.7);
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: var(--grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      color: #fff;
      box-shadow: 0 0 24px rgba(0, 168, 255, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 4px auto 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: var(--grad);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0, 168, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 0 38px rgba(0, 168, 255, 0.55); }
    .btn:active { transform: translateY(0); }

    .small {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(139, 151, 168, 0.8);
    }

    .small a { color: var(--accent); text-decoration: none; }
    .small a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-hidden="true">AF</div>
    <h1 data-i18n="h1">Opening Apps Father…</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p data-i18n="p">If Telegram doesn't open automatically, tap the button below.</p>
    <a id="fallback" class="btn" href="#" rel="noopener" data-i18n="btn">Open in Telegram</a>
    <div class="small" data-i18n-html="small">
      Don't have Telegram? <a id="webLink" href="#" rel="noopener">Open in browser</a>
    </div>
  </main>

  <script>
    (function () {
      var TR = {
        en: {
          "title": "Opening Apps Father…",
          "h1": "Opening Apps Father…",
          "p": "If Telegram doesn't open automatically, tap the button below.",
          "btn": "Open in Telegram",
          "small": "Don't have Telegram? <a id=\"webLink\" href=\"#\" rel=\"noopener\">Open in browser</a>"
        },
        ru: {
          "title": "Открываем Apps Father…",
          "h1": "Открываем Apps Father…",
          "p": "Если Telegram не открылся автоматически, нажмите кнопку ниже.",
          "btn": "Открыть в Telegram",
          "small": "Нет Telegram? <a id=\"webLink\" href=\"#\" rel=\"noopener\">Открыть в браузере</a>"
        },
        uk: {
          "title": "Відкриваємо Apps Father…",
          "h1": "Відкриваємо Apps Father…",
          "p": "Якщо Telegram не відкрився автоматично, натисніть кнопку нижче.",
          "btn": "Відкрити в Telegram",
          "small": "Немає Telegram? <a id=\"webLink\" href=\"#\" rel=\"noopener\">Відкрити у браузері</a>"
        }
      };

      function pickLang() {
        var raw = "";
        try { raw = (new URLSearchParams(window.location.search).get("lang") || "").trim().toLowerCase(); } catch (_) {}
        if (!raw) {
          try { raw = ((navigator.language || "en") + "").toLowerCase(); } catch (_) { raw = "en"; }
        }
        if (raw.indexOf("ru") === 0) return "ru";
        if (raw.indexOf("uk") === 0 || raw.indexOf("ua") === 0) return "uk";
        return "en";
      }

      var lang = pickLang();
      var dict = TR[lang] || TR.en;

      try { document.documentElement.lang = lang; } catch (_) {}

      try {
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key] != null) el.textContent = dict[key];
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-html");
          if (dict[key] != null) el.innerHTML = dict[key];
        });
      } catch (_) {}
    })();
  </script>

  <script>
    (function () {
      var BOT = "apps_father_bot";
      var APP = "app";

      function getStartApp() {
        try {
          var sp = new URLSearchParams(window.location.search).get("startapp") || "";
          sp = sp.trim();
          if (!sp) return "";
          // Telegram allows [A-Za-z0-9_-], up to 64 chars. Sanitize defensively.
          return sp.replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
        } catch (_) { return ""; }
      }

      var sa = getStartApp();
      var qs = sa ? ("&startapp=" + encodeURIComponent(sa)) : "";

      // tg:// deep link — opens the Telegram client directly.
      var tgUrl = "tg://resolve?domain=" + BOT + "&appname=" + APP + qs;
      // https://t.me — universal fallback (works in browsers; auto-opens app on iOS/Android).
      var webUrl = "https://t.me/" + BOT + "/" + APP + (sa ? ("?startapp=" + encodeURIComponent(sa)) : "");

      var fallback = document.getElementById("fallback");
      var webLink = document.getElementById("webLink");
      fallback.href = tgUrl;
      webLink.href = webUrl;

      // Manual click goes through the conversion tracker, then opens Telegram.
      fallback.addEventListener("click", function (e) {
        e.preventDefault();
        try {
          if (typeof window.gtag_report_conversion === "function") {
            window.gtag_report_conversion(tgUrl);
          } else {
            window.location = tgUrl;
          }
        } catch (_) { window.location = tgUrl; }
      });

      webLink.addEventListener("click", function (e) {
        e.preventDefault();
        try {
          if (typeof window.gtag_report_conversion === "function") {
            window.gtag_report_conversion(webUrl);
          } else {
            window.location = webUrl;
          }
        } catch (_) { window.location = webUrl; }
      });

      // Auto-redirect ASAP. We fire the conversion (fire-and-forget so the
      // gtag ping leaves the device even if the deep link unloads us), then
      // jump to tg:// immediately.
      try {
        if (typeof window.gtag === "function") {
          window.gtag("event", "conversion", {
            send_to: "AW-18093639890/NXdICOnui54cENKR3LND",
            value: 1.0,
            currency: "UAH",
            transport_type: "beacon"
          });
        }
      } catch (_) {}

      // Try the native deep link first.
      window.location.href = tgUrl;

      // If after ~2s we're still on this page (no Telegram installed, or
      // the browser silently blocked the tg:// scheme), bounce to the
      // universal https://t.me link — that one always works: mobile
      // browsers will open the Telegram app if it's installed, otherwise
      // they'll show t.me's "Download Telegram / Open in browser" page.
      // The document.hidden guard ensures we DON'T fire the fallback when
      // the deep link succeeded (in that case the tab is backgrounded).
      setTimeout(function () {
        if (document.visibilityState !== "hidden") {
          window.location.replace(webUrl);
        }
      }, 2000);
    })();
  </script>
</body>

</html>

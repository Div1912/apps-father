<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title data-i18n="title">Open Apps Father</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17682419140"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'AW-17682419140');
  </script>

  <style>
    :root {
      --bg:      #07091a;
      --text:    #e9edf6;
      --muted:   #8b97a8;
      --accent:  #00c2ff;
      --accent2: #4f8cff;
      --grad:    linear-gradient(135deg, #00d4ff, #00a8ff 50%, #4f8cff);
      --border:  rgba(99, 179, 237, 0.18);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh; min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 48px;
      background:
        radial-gradient(900px 600px at 80% -10%, rgba(0, 168, 255, 0.18), transparent 60%),
        radial-gradient(800px 600px at 10% 110%, rgba(79, 140, 255, 0.14), transparent 60%),
        var(--bg);
    }

    /* ── card ── */
    .card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      background: rgba(15, 22, 40, 0.65);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      text-align: center;
    }

    /* ── logo ── */
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: url(full-logo.png) center / contain no-repeat, var(--grad);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 8px 32px rgba(0, 168, 255, 0.4);
      margin-bottom: 22px;
      flex-shrink: 0;
    }

    /* ── headline ── */
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #c9d6ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .desc {
      margin: 0 0 32px;
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
      max-width: 300px;
    }

    /* ── button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      background: var(--grad);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow:
        0 0 32px rgba(0, 168, 255, 0.38),
        0 4px 16px rgba(0, 0, 0, 0.25);
      transition: filter 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      filter: brightness(0.9);
      transform: scale(0.97);
    }

    /* Telegram plane icon inside the button */
    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ── subtle pulse ring around the button to draw the eye ── */
    .btn-wrap {
      width: 100%;
      position: relative;
    }

    .btn-wrap::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      background: var(--grad);
      opacity: 0;
      animation: btnPulse 2.2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes btnPulse {
      0%   { opacity: 0;    transform: scale(1);    }
      30%  { opacity: 0.28; }
      100% { opacity: 0;    transform: scale(1.06); }
    }

    /* ── footer note ── */
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(139, 151, 168, 0.7);
      line-height: 1.5;
    }

    .note a { color: var(--accent); text-decoration: none; }

    @media (max-height: 620px) {
      .card { padding: 28px 24px 26px; }
      .logo { width: 56px; height: 56px; margin-bottom: 16px; }
      h1 { font-size: 22px; }
      .desc { margin-bottom: 24px; font-size: 14px; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo"></div>

    <h1>Apps Father</h1>
    <p class="desc" data-i18n="desc">
      Build Telegram Mini Apps without writing a single line of code.
    </p>

    <div class="btn-wrap">
      <button class="btn" id="openBtn">
        <!-- Telegram paper-plane icon -->
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.95 3.35a1.5 1.5 0 0 0-1.6-.35L2.6 9.62a1.5 1.5 0 0 0 .1 2.84l4.3 1.3 1.63 5.1a1.5 1.5 0 0 0 2.56.52l2.27-2.74 4.44 3.28a1.5 1.5 0 0 0 2.34-1l2.97-14.3a1.5 1.5 0 0 0-.32-1.27zM10.5 15.6l-.9-2.8 6.26-5.63-5.36 8.43zm-3.3-3.5-2.9-.88 13.9-5.33-11 6.21z"/></svg>
        <span data-i18n="btn">Open in Telegram</span>
      </button>
    </div>

    <p class="note" data-i18n-html="note">
      No app needed — it opens inside Telegram.<br>
      <a id="webFallbackLink" href="https://t.me/apps_father_bot/app">Open via browser</a>
    </p>
  </div>

  <!-- ── i18n: ?lang= → navigator.language → en ── -->
  <script>
    (function () {
      var TR = {
        en: {
          title:  "Open Apps Father",
          desc:   "Build Telegram Mini Apps without writing a single line of code.",
          btn:    "Open in Telegram",
          note:   "No app needed — it opens inside Telegram.<br><a id=\"webFallbackLink\" href=\"#\">Open via browser</a>"
        },
        ru: {
          title:  "Открыть Apps Father",
          desc:   "Создавай Telegram-приложения без единой строчки кода.",
          btn:    "Открыть в Telegram",
          note:   "Приложение не нужно — открывается прямо в Telegram.<br><a id=\"webFallbackLink\" href=\"#\">Открыть через браузер</a>"
        },
        uk: {
          title:  "Відкрити Apps Father",
          desc:   "Створюй Telegram Mini Apps без жодного рядка коду.",
          btn:    "Відкрити в Telegram",
          note:   "Додаток не потрібен — відкривається прямо в Telegram.<br><a id=\"webFallbackLink\" href=\"#\">Відкрити через браузер</a>"
        }
      };

      function pickLang() {
        var raw = "";
        try { raw = (new URLSearchParams(window.location.search).get("lang") || "").trim().toLowerCase(); } catch (_) {}
        if (!raw) {
          try { raw = ((navigator.language || "en") + "").toLowerCase(); } catch (_) { raw = "en"; }
        }
        if (raw.indexOf("ru") === 0) return "ru";
        if (raw.indexOf("uk") === 0 || raw.indexOf("ua") === 0) return "uk";
        return "en";
      }

      var lang = pickLang();
      var dict = TR[lang] || TR.en;
      try { document.documentElement.lang = lang; } catch (_) {}
      try { document.title = dict.title || document.title; } catch (_) {}

      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var k = el.getAttribute("data-i18n");
        if (dict[k] != null) el.textContent = dict[k];
      });
      document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
        var k = el.getAttribute("data-i18n-html");
        if (dict[k] != null) el.innerHTML = dict[k];
      });

      // Expose for the button script.
      window.__rd = { lang: lang, t: function (k) { return dict[k] || k; } };
    })();
  </script>

  <!-- ── redirect logic (button only — no auto-open) ── -->
  <script>
    (function () {
      var BOT = "apps_father_bot";
      var APP = "app";

      function getStartApp() {
        try {
          var sp = new URLSearchParams(window.location.search).get("startapp") || "";
          return sp.trim().replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
        } catch (_) { return ""; }
      }

      var sa    = getStartApp();
      var qsTg  = sa ? ("&startapp=" + encodeURIComponent(sa)) : "";
      var qsWeb = sa ? ("?startapp=" + encodeURIComponent(sa)) : "";

      // tg:// deep link → opens the mini-app directly inside Telegram
      var tgUrl  = "tg://resolve?domain=" + BOT + "&appname=" + APP + qsTg;
      // https:// fallback for "Open via browser" note link
      var webUrl = "https://t.me/" + BOT + "/" + APP + qsWeb;

      // Wire up the "Open via browser" note link once the note HTML is in the DOM.
      var fallback = document.getElementById("webFallbackLink");
      if (fallback) fallback.href = webUrl;

      function handleOpen(e) {
        if (e) e.preventDefault();

        // 1) Fire Google Ads conversion
        try {
          window.gtag && window.gtag("event", "conversion", {
            send_to:        "AW-17682419140/pRpsCIL716AcEMSb0e9B",
            transport_type: "beacon"
          });
        } catch (_) {}

        // 2) Navigate to the tg:// deep link — Telegram handles startapp
        window.location.href = tgUrl;
      }

      document.getElementById("openBtn").addEventListener("click", handleOpen);
    })();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agent Log</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #1a1a2e;
  --bg-card: #16213e;
  --bg-hover: #1a2744;
  --text: #e0e0e0;
  --text-dim: #8892a4;
  --accent: #4facfe;
  --accent-dim: #2d7dd2;
  --green: #43e97b;
  --orange: #f7971e;
  --red: #f85032;
  --purple: #a855f7;
  --border: #2a3a5c;
  --thinking-bg: #1e1e3a;
  --tool-bg: #162230;
  --result-bg: #0f1a28;
  --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 16px;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 12px;
  color: var(--red);
}
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, var(--bg) 0%, rgba(26,26,46,0.95) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.header h1 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}
.header-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--accent-dim);
  color: #fff;
  font-weight: 600;
}
.stats-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.stat-chip {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  white-space: nowrap;
}
.stat-chip b { color: var(--text); font-weight: 600; }
.stat-chip.cost b { color: var(--green); }
.stat-chip.duration b { color: var(--orange); }

/* Iteration navigation */
.iter-nav {
  display: flex;
  gap: 4px;
  padding: 12px 16px 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.iter-nav::-webkit-scrollbar { display: none; }
.iter-pill {
  flex-shrink: 0;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}
.iter-pill:hover { background: var(--bg-hover); color: var(--text); }
.iter-pill.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: #fff;
}
.iter-pill.has-write { border-bottom: 2px solid var(--green); }

/* Content area */
.content { padding: 8px 12px 80px; }
.iteration-group {
  margin-bottom: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg-card);
}
.iter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--bg-card), var(--bg-hover));
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.iter-header:active { opacity: 0.8; }
.iter-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
}
.iter-meta {
  display: flex;
  gap: 8px;
  align-items: center;
}
.iter-time {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.iter-tokens {
  font-size: 11px;
  color: var(--text-dim);
}
.iter-chevron {
  font-size: 14px;
  color: var(--text-dim);
  transition: transform 0.2s;
}
.iter-header.collapsed .iter-chevron { transform: rotate(-90deg); }
.iter-body { padding: 0; }
.iter-body.collapsed { display: none; }

/* Entries */
.entry {
  padding: 8px 14px;
  border-bottom: 1px solid rgba(42,58,92,0.4);
  font-size: 13px;
}
.entry:last-child { border-bottom: none; }
.entry-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.entry-label .icon { font-size: 13px; }

/* Thinking */
.entry.thinking { background: var(--thinking-bg); }
.entry.thinking .entry-label { color: var(--purple); }
.entry.thinking .entry-content {
  color: var(--text-dim);
  font-style: italic;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
  max-height: 120px;
  overflow: hidden;
  position: relative;
}
.entry.thinking .entry-content.expanded { max-height: none; }
.entry.thinking .entry-content:not(.expanded)::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(transparent, var(--thinking-bg));
}

/* Text (Claude messages) */
.entry.text .entry-label { color: var(--accent); }
.entry.text .entry-content {
  white-space: pre-wrap;
  word-break: break-word;
}

/* Tool calls */
.entry.tool-call { background: var(--tool-bg); }
.entry.tool-call .entry-label { color: var(--orange); }
.tool-name {
  font-weight: 700;
  color: var(--orange);
  font-family: var(--font-mono);
  font-size: 13px;
}
.tool-args {
  font-family: var(--font-mono);
  font-size: 11px;
  background: rgba(0,0,0,0.3);
  border-radius: 6px;
  padding: 6px 8px;
  margin-top: 4px;
  color: var(--text-dim);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 200px;
  overflow-y: auto;
}

/* Tool results */
.entry.tool-result { background: var(--result-bg); }
.entry.tool-result .entry-label { color: var(--green); }
.tool-result-content {
  font-family: var(--font-mono);
  font-size: 11px;
  background: rgba(0,0,0,0.3);
  border-radius: 6px;
  padding: 6px 8px;
  margin-top: 4px;
  color: var(--text-dim);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 150px;
  overflow: hidden;
  position: relative;
}
.tool-result-content.expanded { max-height: none; }
.tool-result-content:not(.expanded)::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 30px;
  background: linear-gradient(transparent, var(--result-bg));
}
.result-len {
  font-size: 10px;
  color: var(--text-dim);
  margin-left: 6px;
  opacity: 0.7;
}

/* Expand button */
.expand-btn {
  display: inline-block;
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  margin-top: 4px;
  padding: 2px 0;
  border: none;
  background: none;
  font-family: inherit;
}
.expand-btn:hover { text-decoration: underline; }

/* Tokens row */
.entry.tokens {
  background: rgba(79, 172, 254, 0.05);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 6px 14px;
}
.token-chip {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-dim);
}
.token-chip b { color: var(--text); }

/* Done */
.entry.done {
  background: linear-gradient(135deg, rgba(67,233,123,0.08), rgba(67,233,123,0.02));
  border-left: 3px solid var(--green);
}
.entry.done .entry-label { color: var(--green); }
.entry.done .entry-content { white-space: pre-wrap; word-break: break-word; }

/* Error */
.entry.error {
  background: rgba(248,80,50,0.08);
  border-left: 3px solid var(--red);
}
.entry.error .entry-label { color: var(--red); }

/* Prompt section */
.prompt-section {
  margin: 8px 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg-card);
}
.prompt-header {
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--bg-card), var(--bg-hover));
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.prompt-header:active { opacity: 0.8; }
.prompt-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--purple);
}
.prompt-body {
  padding: 10px 14px;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text-dim);
  max-height: 200px;
  overflow-y: auto;
}
.prompt-body.collapsed { display: none; }

/* Legacy plain text */
.legacy-log {
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text-dim);
  line-height: 1.6;
}

/* Write badge */
.write-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 6px;
  background: rgba(67,233,123,0.15);
  color: var(--green);
  font-weight: 700;
  margin-left: 6px;
}
/* Tool badges */
.tool-count-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  background: rgba(247,151,30,0.15);
  color: var(--orange);
  font-weight: 600;
}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <div style="color:var(--text-dim);font-size:14px;">Loading agent log...</div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
try { tg?.ready?.(); tg?.expand?.(); } catch (_) {}

const params = new URLSearchParams(window.location.search);
const projectId = params.get('projectId');
const version = params.get('version');

/** Parent mini app passes initData in hash (#initData=...) so iframe requests are authenticated. */
function resolveInitData() {
  if (tg?.initData) return tg.initData;
  const fromQuery = params.get('initData');
  if (fromQuery) return fromQuery;
  const raw = (location.hash || '').replace(/^#/, '');
  if (raw.startsWith('initData=')) {
    try {
      return decodeURIComponent(raw.slice('initData='.length));
    } catch (_) {
      return raw.slice('initData='.length);
    }
  }
  return '';
}

const initData = resolveInitData();

async function loadLog() {
  const appEl = document.getElementById('app');
  try {
    if (!initData) {
      throw new Error('Missing Telegram init data. Open this log from the mini app.');
    }
    const res = await fetch(`/telegram-mini-app/api/versions/${projectId}/log-data/${version}`, {
      headers: { 'X-Telegram-Init-Data': initData }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderLog(data.entries, data.version);
  } catch (e) {
    appEl.innerHTML = `<div class="error-screen"><div style="font-size:32px">⚠️</div><div>${e.message}</div></div>`;
  }
}

function fmtMs(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m > 0 ? `${m}m ${s % 60}s` : `${s}s`;
}

function fmtTokens(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function truncateArgs(args) {
  const s = JSON.stringify(args, null, 2);
  if (s.length <= 2000) return s;

  const compact = {};
  for (const [k, v] of Object.entries(args)) {
    if (typeof v === 'string' && v.length > 500) {
      compact[k] = v.substring(0, 500) + `... (${v.length} chars)`;
    } else {
      compact[k] = v;
    }
  }
  return JSON.stringify(compact, null, 2);
}

function renderLog(entries, ver) {
  const appEl = document.getElementById('app');

  if (entries.length === 1 && entries[0].legacy) {
    appEl.innerHTML = `<div class="header"><h1>Agent Log — Version #${ver}</h1></div><div class="legacy-log">${esc(entries[0].text)}</div>`;
    return;
  }

  const headerEntry = entries.find(e => e.type === 'header');
  const doneEntry = entries.find(e => e.type === 'done');
  const lastTokens = [...entries].reverse().find(e => e.type === 'tokens');

  // Group entries by iteration
  const iterations = new Map();
  let currentIter = 0;
  const promptEntries = [];
  for (const e of entries) {
    if (e.type === 'header') { promptEntries.push(e); continue; }
    if (e.type === 'done') continue;
    if (e.type === 'iteration') { currentIter = e.iteration; }
    if (!iterations.has(currentIter)) iterations.set(currentIter, []);
    iterations.get(currentIter).push(e);
  }

  // Determine which iterations have writes
  const writeIters = new Set();
  for (const [iter, ents] of iterations) {
    for (const e of ents) {
      if (e.type === 'tool_call' && ['write_file', 'edit_file', 'deploy_to_dev'].includes(e.tool)) {
        writeIters.add(iter);
      }
    }
  }

  // Build header stats
  const totalIter = doneEntry?.iterations || iterations.size;
  const totalIn = doneEntry?.totalInput || lastTokens?.total?.input || 0;
  const totalOut = doneEntry?.totalOutput || lastTokens?.total?.output || 0;
  const durationMs = doneEntry?.durationMs || entries[entries.length - 1]?.elapsed || 0;
  const cost = lastTokens?.costUsd;
  const model = headerEntry?.model || '—';

  let html = `<div class="header">
    <div class="header-top">
      <h1>Agent Log #${ver}</h1>
      <span class="header-badge">${esc(model.replace('claude-', '').replace(/-\d{8}$/, ''))}</span>
    </div>
    <div class="stats-bar">
      <span class="stat-chip"><b>${totalIter}</b> iters</span>
      <span class="stat-chip"><b>${fmtTokens(totalIn)}</b> in / <b>${fmtTokens(totalOut)}</b> out</span>
      <span class="stat-chip duration"><b>${fmtMs(durationMs)}</b></span>
      ${cost != null ? `<span class="stat-chip cost"><b>$${cost.toFixed(4)}</b></span>` : ''}
    </div>
  </div>`;

  // Iteration pills
  html += `<div class="iter-nav">`;
  for (const [iter] of iterations) {
    if (iter === 0) continue;
    const cls = writeIters.has(iter) ? 'iter-pill has-write' : 'iter-pill';
    html += `<div class="${cls}" data-goto="${iter}">${iter}</div>`;
  }
  html += `</div>`;

  // Prompt
  if (headerEntry?.prompt) {
    html += `<div class="prompt-section">
      <div class="prompt-header" onclick="this.nextElementSibling.classList.toggle('collapsed');this.querySelector('.iter-chevron').classList.toggle('collapsed')">
        <span class="prompt-title">📋 User Prompt</span>
        <span class="iter-chevron collapsed">▼</span>
      </div>
      <div class="prompt-body collapsed">${esc(headerEntry.prompt)}</div>
    </div>`;
  }

  html += `<div class="content">`;

  // Render each iteration
  for (const [iter, ents] of iterations) {
    if (iter === 0 && ents.length <= 1) continue;

    const iterTokens = ents.find(e => e.type === 'tokens');
    const toolCalls = ents.filter(e => e.type === 'tool_call');
    const hasWrite = writeIters.has(iter);

    html += `<div class="iteration-group" id="iter-${iter}">
      <div class="iter-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="iter-title">Iteration ${iter}</span>
          ${toolCalls.length > 0 ? `<span class="tool-count-badge">${toolCalls.length} tool${toolCalls.length > 1 ? 's' : ''}</span>` : ''}
          ${hasWrite ? '<span class="write-badge">WRITE</span>' : ''}
        </div>
        <div class="iter-meta">
          ${iterTokens?.iter ? `<span class="iter-tokens">+${fmtTokens(iterTokens.iter.input)}/${fmtTokens(iterTokens.iter.output)}</span>` : ''}
          <span class="iter-time">${fmtMs(ents[0]?.elapsed || 0)}</span>
          <span class="iter-chevron">▼</span>
        </div>
      </div>
      <div class="iter-body">`;

    for (const e of ents) {
      if (e.type === 'iteration') continue;

      if (e.type === 'thinking') {
        const id = `th-${iter}-${Math.random().toString(36).substr(2,6)}`;
        html += `<div class="entry thinking">
          <div class="entry-label"><span class="icon">🧠</span> Thinking</div>
          <div class="entry-content" id="${id}">${esc(e.text)}</div>
          ${e.text.length > 300 ? `<button class="expand-btn" onclick="document.getElementById('${id}').classList.toggle('expanded');this.textContent=this.textContent==='Show more'?'Show less':'Show more'">Show more</button>` : ''}
        </div>`;
      }
      else if (e.type === 'text') {
        html += `<div class="entry text">
          <div class="entry-label"><span class="icon">💬</span> Claude</div>
          <div class="entry-content">${esc(e.text)}</div>
        </div>`;
      }
      else if (e.type === 'tool_call') {
        const isWrite = ['write_file', 'edit_file', 'deploy_to_dev'].includes(e.tool);
        html += `<div class="entry tool-call">
          <div class="entry-label"><span class="icon">${isWrite ? '✏️' : '🔧'}</span> <span class="tool-name">${esc(e.tool)}</span></div>
          <div class="tool-args">${esc(truncateArgs(e.args || {}))}</div>
        </div>`;
      }
      else if (e.type === 'tool_result') {
        const rId = `tr-${iter}-${Math.random().toString(36).substr(2,6)}`;
        const result = e.result || '';
        const isLong = result.length > 300;
        html += `<div class="entry tool-result">
          <div class="entry-label"><span class="icon">📥</span> ${esc(e.tool)} result <span class="result-len">${e.resultLength || result.length} chars</span></div>
          <div class="tool-result-content${isLong ? '' : ' expanded'}" id="${rId}">${esc(result)}</div>
          ${isLong ? `<button class="expand-btn" onclick="document.getElementById('${rId}').classList.toggle('expanded');this.textContent=this.textContent==='Show more'?'Show less':'Show more'">Show more</button>` : ''}
        </div>`;
      }
      else if (e.type === 'tokens') {
        html += `<div class="entry tokens">
          <span style="font-size:11px;color:var(--text-dim);">📊</span>
          ${e.iter ? `<span class="token-chip">iter: <b>+${fmtTokens(e.iter.input)}</b>/<b>${fmtTokens(e.iter.output)}</b></span>` : ''}
          <span class="token-chip">total: <b>${fmtTokens(e.total?.input || 0)}</b> in / <b>${fmtTokens(e.total?.output || 0)}</b> out</span>
          ${e.total?.cacheRead > 0 ? `<span class="token-chip">cache: <b>${fmtTokens(e.total.cacheRead)}</b></span>` : ''}
          ${e.costUsd != null ? `<span class="token-chip" style="color:var(--green)"><b>$${e.costUsd.toFixed(4)}</b></span>` : ''}
        </div>`;
      }
      else if (e.type === 'error') {
        html += `<div class="entry error">
          <div class="entry-label"><span class="icon">❌</span> Error</div>
          <div class="entry-content">${esc(e.message)}</div>
        </div>`;
      }
    }

    html += `</div></div>`;
  }

  // Done entry
  if (doneEntry) {
    html += `<div class="iteration-group">
      <div class="entry done" style="border-radius:12px;">
        <div class="entry-label"><span class="icon">✅</span> Done — ${totalIter} iterations in ${fmtMs(durationMs)}</div>
        <div class="entry-content">${esc(doneEntry.summary || '')}</div>
      </div>
    </div>`;
  }

  html += `</div>`;
  appEl.innerHTML = html;

  // Iteration pill click → scroll
  document.querySelectorAll('[data-goto]').forEach(pill => {
    pill.addEventListener('click', () => {
      const target = document.getElementById(`iter-${pill.dataset.goto}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.querySelectorAll('.iter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
      }
    });
  });

  // Scroll spy for pills
  const observer = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting) {
        const id = e.target.id.replace('iter-', '');
        document.querySelectorAll('.iter-pill').forEach(p => p.classList.toggle('active', p.dataset.goto === id));
      }
    }
  }, { rootMargin: '-80px 0px -70% 0px' });
  document.querySelectorAll('.iteration-group[id]').forEach(el => observer.observe(el));
}

if (projectId && version) {
  loadLog();
} else {
  document.getElementById('app').innerHTML = '<div class="error-screen"><div style="font-size:32px">⚠️</div><div>Missing projectId or version parameter</div></div>';
}
</script>
</body>
</html>
